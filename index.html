<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nusuk Permit Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --btn-bg: #1e293b;
            --success-btn: #16a34a;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            max-width: 480px;
            width: 100%;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        h2 { text-align: center; margin-top: 0; font-size: 20px; }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
        }

        label { font-size: 13px; font-weight: bold; margin-bottom: 4px; }
        
        input, select {
            padding: 9px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            background-color: var(--btn-bg);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .download-btn { background-color: var(--success-btn); }

        #canvasContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            max-width: 100%;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        }

        #qrcode { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Nusuk Permit Pass Generator</h2>

        <div class="grid-2">
            <div class="form-group">
                <label>Permit ID (10 Digits)</label>
                <input type="text" id="permit_id" value="1156259366">
            </div>
            <div class="form-group">
                <label>Card Type</label>
                <select id="card_type">
                    <option value="standard">Standard Card</option>
                    <option value="privilege">Privilege Card (Yellow)</option>
                </select>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>Visit Date</label>
                <input type="text" id="visit_date" value="23 Sep 2026">
            </div>
            <div class="form-group">
                <label>Visit Time</label>
                <input type="text" id="visit_time" value="11:20 AM">
            </div>
        </div>

        <div class="form-group">
            <label>Permit Status Option</label>
            <select id="status_option">
                <option value="opt3">Option 3: Active Visit ("It's time...") + Cancel & Proceed Notice</option>
                <option value="opt4">Option 4: Approaching Visit ("Please stay close...") + Cancel & Proceed Notice</option>
                <option value="opt1">Option 1: Standard Approaching Message Only</option>
                <option value="opt2">Option 2: Standard Active Message Only</option>
            </select>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>Initial Symbol</label>
                <input type="text" id="user_initial" value="م">
            </div>
            <div class="form-group">
                <label>User Label</label>
                <input type="text" id="user_label" value="You">
            </div>
        </div>

        <div class="btn-group">
            <button class="action-btn" onclick="generateCard()">Generate Card</button>
            <button class="action-btn download-btn" onclick="downloadCard()">Download JPG</button>
        </div>
    </div>

    <div id="canvasContainer">
        <canvas id="cardCanvas" width="600" height="1040"></canvas>
    </div>

    <div id="qrcode"></div>

    <script>
        function generateCard() {
            const permitId = document.getElementById('permit_id').value.trim();
            const cardType = document.getElementById('card_type').value;
            const visitDate = document.getElementById('visit_date').value.trim();
            const visitTime = document.getElementById('visit_time').value.trim();
            const statusOption = document.getElementById('status_option').value;
            const userInitial = document.getElementById('user_initial').value.trim();
            const userLabel = document.getElementById('user_label').value.trim();

            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = "";

            const qrText = `Demo Qr code\n${permitId}AF20260918164020260918170037e982792af9fbd5b78d064f7c87d918498bca03440d0ff5cbebe760e1d825e5`;

            new QRCode(qrContainer, {
                text: qrText,
                width: 250,
                height: 250,
                correctLevel : QRCode.CorrectLevel.M
            });

            setTimeout(() => {
                const qrImg = qrContainer.querySelector('img');
                const canvas = document.getElementById('cardCanvas');
                const ctx = canvas.getContext('2d');

                const W = 600;
                const H = 1040;

                // Outer Background
                ctx.fillStyle = "#e5e7eb";
                ctx.fillRect(0, 0, W, H);

                // Main Inner Card Sheet
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.roundRect(20, 20, W - 40, H - 40, 24);
                ctx.fill();

                ctx.textAlign = "center";

                // Date
                ctx.fillStyle = "#1f2937";
                ctx.font = "bold 40px Arial, sans-serif";
                ctx.fillText(visitDate, W / 2, 110);

                // Time
                ctx.fillStyle = "#4b5563";
                ctx.font = "34px Arial, sans-serif";
                ctx.fillText(visitTime, W / 2, 165);

                // Dashed Line
                ctx.strokeStyle = "#e5e7eb";
                ctx.lineWidth = 2;
                ctx.setLineDash([8, 8]);
                ctx.beginPath();
                ctx.moveTo(40, 200);
                ctx.lineTo(W - 40, 200);
                ctx.stroke();
                ctx.setLineDash([]);

                // QR Container Rendering
                const boxX = (W - 320) / 2;
                const boxY = 225;

                if (cardType === 'privilege') {
                    ctx.fillStyle = "#d97706";
                    ctx.beginPath();
                    ctx.roundRect(boxX, boxY, 320, 360, 20);
                    ctx.fill();

                    ctx.fillStyle = "#ffffff";
                    ctx.font = "bold 22px Arial, sans-serif";
                    ctx.fillText("Privilege Card  ⓘ", W / 2, boxY + 36);

                    ctx.fillStyle = "#ffffff";
                    ctx.beginPath();
                    ctx.roundRect(boxX + 15, boxY + 52, 290, 290, 12);
                    ctx.fill();

                    if (qrImg) {
                        ctx.drawImage(qrImg, boxX + 35, boxY + 72, 250, 250);
                    }
                } else {
                    ctx.fillStyle = "#f3f4f6";
                    ctx.beginPath();
                    ctx.roundRect(boxX, boxY, 320, 310, 20);
                    ctx.fill();

                    if (qrImg) {
                        ctx.drawImage(qrImg, boxX + 35, boxY + 30, 250, 250);
                    }
                }

                // Permit ID
                ctx.fillStyle = "#1f2937";
                ctx.font = "38px Arial, sans-serif";
                const idYPosition = (cardType === 'privilege') ? 640 : 595;
                ctx.fillText(permitId, W / 2, idYPosition);

                // Initial Circle
                const circleX = W / 2;
                const circleY = idYPosition + 75;
                ctx.fillStyle = "#f3f4f6";
                ctx.beginPath();
                ctx.arc(circleX, circleY, 38, 0, Math.PI * 2);
                ctx.fill();

                // Initial Letter
                ctx.fillStyle = "#374151";
                ctx.font = "bold 32px Arial, sans-serif";
                ctx.fillText(userInitial, circleX, circleY + 11);

                // Label ("You")
                ctx.fillStyle = "#6b7280";
                ctx.font = "20px Arial, sans-serif";
                ctx.fillText(userLabel, W / 2, circleY + 62);

                // Status Message Rendering
                ctx.fillStyle = "#4b5563";
                ctx.font = "20px Arial, sans-serif";
                const statusY = circleY + 115;

                if (statusOption === 'opt2' || statusOption === 'opt3') {
                    ctx.fillText("⏳ It's time for your blessed visit. Please", W / 2, statusY);
                    ctx.fillText("proceed.", W / 2, statusY + 28);
                } else {
                    ctx.fillText("Please stay close. Your visit time is", W / 2, statusY);
                    ctx.fillText("approaching.", W / 2, statusY + 28);
                }

                // Option 3 aur Option 4 ke Bottom Actions (Cancel booking + Proceed notice)
                if (statusOption === 'opt3' || statusOption === 'opt4') {
                    ctx.fillStyle = "#dc2626";
                    ctx.font = "22px Arial, sans-serif";
                    ctx.fillText("Cancel booking", W / 2, statusY + 85);

                    ctx.fillStyle = "#d97706";
                    ctx.font = "bold 20px Arial, sans-serif";
                    ctx.fillText("⚠️  Please proceed now.", W / 2, statusY + 125);
                }

            }, 120);
        }

        function downloadCard() {
            const canvas = document.getElementById('cardCanvas');
            const permitId = document.getElementById('permit_id').value.trim();
            const fileName = permitId ? `${permitId}_permit.jpg` : 'Permit_Card.jpg';
            
            const link = document.createElement('a');
            link.download = fileName;
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.onload = function() {
            generateCard();
        };
    </script>

</body>
</html>
