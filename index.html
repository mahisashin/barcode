<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo QR Pass Generator</title>
    <!-- QRCode.js library for browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --label-color: #374151;
            --input-bg: #ffffff;
            --input-border: #d1d5db;
            --input-text: #1f2937;
            --btn-bg: #1e293b;
            --btn-hover: #0f172a;
        }

        body.dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #f3f4f6;
            --label-color: #d1d5db;
            --input-bg: #2d2d2d;
            --input-border: #4b5563;
            --input-text: #ffffff;
            --btn-bg: #38bdf8;
            --btn-hover: #0284c7;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        .header-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: -10px;
            margin-top: 10px;
        }

        .theme-toggle-btn {
            padding: 8px 16px;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--btn-bg);
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .theme-toggle-btn:hover {
            transform: scale(1.05);
        }

        .container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            max-width: 480px;
            width: 100%;
            margin-top: 15px;
            margin-bottom: 25px;
            transition: background 0.3s;
            box-sizing: border-box;
        }

        h2 { text-align: center; margin-top: 0; color: var(--text-color); }
        p.subtitle { text-align: center; color: #9ca3af; font-size: 14px; margin-bottom: 20px; }
        
        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        label { font-size: 14px; font-weight: bold; margin-bottom: 5px; color: var(--label-color); }
        
        input {
            padding: 10px;
            background-color: var(--input-bg);
            color: var(--input-text);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            font-size: 14px;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--btn-bg);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        .action-btn:hover { background-color: var(--btn-hover); }

        #canvasContainer {
            max-width: 100%;
            overflow-x: auto;
            text-align: center;
        }

        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        }

        /* Hidden div to generate temporary QR element */
        #qrcode { display: none; }
    </style>
</head>
<body>

    <div class="header-bar">
        <button class="theme-toggle-btn" onclick="toggleDarkMode()">
            <span id="themeIcon">🌙</span> <span id="themeText">Dark Mode</span>
        </button>
    </div>

    <div class="container">
        <h2>Demo QR Pass Generator</h2>
        <p class="subtitle">Complete details enter karein</p>
        
        <div class="form-group">
            <label>Name:</label>
            <input type="text" id="name" value="Shama Jamali Tariq Aziz">
        </div>
        <div class="form-group">
            <label>ID:</label>
            <input type="text" id="demo_id" value="115582669">
        </div>
        <div class="form-group">
            <label>Date:</label>
            <input type="text" id="date" value="17 Sep 2026">
        </div>
        <div class="form-group">
            <label>Start Time:</label>
            <input type="text" id="start_time" value="09:10 AM">
        </div>
        <div class="form-group">
            <label>End Time:</label>
            <input type="text" id="end_time" value="10:10 AM">
        </div>

        <button class="action-btn" onclick="generateCard()">Generate Image</button>
    </div>

    <div id="canvasContainer">
        <canvas id="cardCanvas" width="600" height="900"></canvas>
    </div>

    <div id="qrcode"></div>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
            document.getElementById('themeText').textContent = isDark ? 'Light Mode' : 'Dark Mode';
        }

        function generateCard() {
            const name = document.getElementById('name').value.trim();
            const demoId = document.getElementById('demo_id').value.trim();
            const date = document.getElementById('date').value.trim();
            const startTime = document.getElementById('start_time').value.trim();
            const endTime = document.getElementById('end_time').value.trim();

            if (!name || !demoId || !date || !startTime || !endTime) {
                alert("Tamam fields (Name, ID, Date, Start Time, End Time) fill karein.");
                return;
            }

            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = "";

            const qrText = `DEMO-PASS\nName: ${name}\nID: ${demoId}\nDate: ${date}\nStart: ${startTime}\nEnd: ${endTime}`;

            // Generate QR code JS
            new QRCode(qrContainer, {
                text: qrText,
                width: 270,
                height: 270,
                correctLevel : QRCode.CorrectLevel.M
            });

            setTimeout(() => {
                const qrImg = qrContainer.querySelector('img');
                const canvas = document.getElementById('cardCanvas');
                const ctx = canvas.getContext('2d');

                // Canvas dimensions
                const W = 600;
                const H = 900;

                // Background fill
                ctx.fillStyle = "#f5f7f9";
                ctx.fillRect(0, 0, W, H);

                ctx.textAlign = "center";

                // Date Text
                ctx.fillStyle = "#1e293b";
                ctx.font = "38px Arial, sans-serif";
                ctx.fillText(date, W / 2, 90);

                // Time Range Text (e.g. 09:10 AM - 10:10 AM)
                ctx.fillStyle = "#334155";
                ctx.font = "32px Arial, sans-serif";
                const timeRange = `${startTime} - ${endTime}`;
                ctx.fillText(timeRange, W / 2, 145);

                // QR Card Container Box (White Rounded Card)
                ctx.fillStyle = "#ffffff";
                ctx.shadowColor = "rgba(0, 0, 0, 0.05)";
                ctx.shadowBlur = 15;
                ctx.shadowOffsetY = 4;
                ctx.beginPath();
                ctx.roundRect(140, 195, 320, 320, 20);
                ctx.fill();

                // Reset shadow
                ctx.shadowColor = "transparent";

                // Draw QR Code inside box
                if (qrImg) {
                    ctx.drawImage(qrImg, 165, 220, 270, 270);
                }

                // ID Number Below QR
                ctx.fillStyle = "#1e293b";
                ctx.font = "36px Arial, sans-serif";
                ctx.fillText(demoId, W / 2, 580);

                // Circle Avatar
                const circleX = W / 2;
                const circleY = 670;
                const circleR = 45;

                ctx.fillStyle = "#e2e8f0";
                ctx.beginPath();
                ctx.arc(circleX, circleY, circleR, 0, Math.PI * 2);
                ctx.fill();

                // Initial Letter inside circle (First letter of Name or 'ش')
                const initialChar = name.charAt(0) || "ش";
                ctx.fillStyle = "#0f172a";
                ctx.font = "bold 38px Arial, sans-serif";
                ctx.fillText(initialChar, circleX, circleY + 13);

                // User Label ("You")
                ctx.fillStyle = "#334155";
                ctx.font = "24px Arial, sans-serif";
                ctx.fillText("You", W / 2, 755);

                // Footer Message
                ctx.fillStyle = "#64748b";
                ctx.font = "20px Arial, sans-serif";
                ctx.fillText("Please stay close. Your visit time is", W / 2, 820);
                ctx.fillText("approaching.", W / 2, 850);

            }, 120);
        }

        // Auto render on page load
        window.onload = generateCard;
    </script>

</body>
</html>
