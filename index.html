<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Pass Designed by JHONE</title>
    <!-- QRCode.js library for browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --label-color: #374151;
            --input-bg: #ffffff;
            --input-border: #d1d5db;
            --input-text: #1f2937;
            --btn-bg: #1e293b;
            --btn-hover: #0f172a;
            --success-btn: #16a34a;
            --success-hover: #15803d;
        }

        body.dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #f3f4f6;
            --label-color: #d1d5db;
            --input-bg: #2d2d2d;
            --input-border: #4b5563;
            --input-text: #ffffff;
            --btn-bg: #38bdf8;
            --btn-hover: #0284c7;
            --success-btn: #22c55e;
            --success-hover: #16a34a;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        .header-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: -10px;
            margin-top: 10px;
        }

        .theme-toggle-btn {
            padding: 8px 16px;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--btn-bg);
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .theme-toggle-btn:hover {
            transform: scale(1.05);
        }

        .container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            max-width: 480px;
            width: 100%;
            margin-top: 15px;
            margin-bottom: 25px;
            transition: background 0.3s;
            box-sizing: border-box;
        }

        h2 { text-align: center; margin-top: 0; color: var(--text-color); }
        p.subtitle { text-align: center; color: #9ca3af; font-size: 14px; margin-bottom: 20px; }
        
        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        label { font-size: 14px; font-weight: bold; margin-bottom: 5px; color: var(--label-color); }
        
        input {
            padding: 10px;
            background-color: var(--input-bg);
            color: var(--input-text);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            font-size: 14px;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--btn-bg);
            color: white;
            border: none;
