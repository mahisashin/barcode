<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nusuk to Permit Generator</title>
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --btn-bg: #1e293b;
            --btn-hover: #0f172a;
            --success-btn: #16a34a;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            max-width: 450px;
            width: 100%;
            margin-bottom: 25px;
            box-sizing: border-box;
        }

        h2 { text-align: center; margin-top: 0; font-size: 20px; }
        
        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        label { font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        
        input {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btn {
            padding: 12px;
            background-color: var(--btn-bg);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .download-btn { background-color: var(--success-btn); }

        #canvasContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            max-width: 100%;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        }

        #qrcode { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Nusuk Permit Pass Generator</h2>
        
        <div class="form-group">
            <label>Nusuk ID (Auto-Fill Lookup)</label>
            <input type="text" id="nusuk_id" value="20267477084186" oninput="autoFillFromNusuk()" placeholder="e.g. 20267477084186">
        </div>

        <div class="form-group">
            <label>Permit ID / Booking ID</label>
            <input type="text" id="permit_id" value="5813241226">
        </div>

        <div class="form-group">
            <label>Visit Date</label>
            <input type="text" id="visit_date" value="18 Sep 2026">
        </div>

        <div class="form-group">
            <label>Visit Time</label>
            <input type="text" id="visit_time" value="04:40 PM">
        </div>

        <div class="form-group">
            <label>Initial Symbol (e.g. م / b)</label>
            <input type="text" id="user_initial" value="م">
        </div>

        <div class="form-group">
            <label>User Label</label>
            <input type="text" id="user_label" value="You">
        </div>

        <div class="btn-group">
            <button class="action-btn" onclick="generateCard()">Generate Permit Card</button>
            <button class="action-btn download-btn" onclick="downloadCard()">Download JPG</button>
        </div>
    </div>

    <div id="canvasContainer">
        <canvas id="cardCanvas" width="600" height="960"></canvas>
    </div>

    <div id="qrcode"></div>

    <script>
        // Local Database Mapping Table
        const nusukDatabase = {
            "20267477084186": {
                permitId: "5813241226",
                date: "18 Sep 2026",
                time: "04:40 PM",
                initial: "م",
                label: "You"
            },
            "20267946047340": {
                permitId: "1155913541",
                date: "22 Sep 2026",
                time: "02:40 PM",
                initial: "b",
                label: "You"
            }
        };

        function autoFillFromNusuk() {
            const nusukId = document.getElementById('nusuk_id').value.trim();
            if (nusukDatabase[nusukId]) {
                const data = nusukDatabase[nusukId];
                document.getElementById('permit_id').value = data.permitId;
                document.getElementById('visit_date').value = data.date;
                document.getElementById('visit_time').value = data.time;
                document.getElementById('user_initial').value = data.initial;
                document.getElementById('user_label').value = data.label;
            }
        }

        function generateCard() {
            const permitId = document.getElementById('permit_id').value.trim();
            const visitDate = document.getElementById('visit_date').value.trim();
            const visitTime = document.getElementById('visit_time').value.trim();
            const userInitial = document.getElementById('user_initial').value.trim();
            const userLabel = document.getElementById('user_label').value.trim();

            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = "";

            // QR Code Payload
            const qrText = `Demo Qr code\n${permitId}AF20260918164020260918170037e982792af9fbd5b78d064f7c87d918498bca03440d0ff5cbebe760e1d825e5`;

            new QRCode(qrContainer, {
                text: qrText,
                width: 270,
                height: 270,
                correctLevel : QRCode.CorrectLevel.M
            });

            setTimeout(() => {
                const qrImg = qrContainer.querySelector('img');
                const canvas = document.getElementById('cardCanvas');
                const ctx = canvas.getContext('2d');

                const W = 600;
                const H = 960;

                // Background
                ctx.fillStyle = "#f1f3f5";
                ctx.fillRect(0, 0, W, H);

                ctx.textAlign = "center";

                // Date
                ctx.fillStyle = "#2c3137";
                ctx.font = "42px Arial, sans-serif";
                ctx.fillText(visitDate, W / 2, 110);

                // Time
                ctx.fillStyle = "#4a515a";
                ctx.font = "36px Arial, sans-serif";
                ctx.fillText(visitTime, W / 2, 170);

                // Dashed Line
                ctx.strokeStyle = "#dbdfe5";
                ctx.lineWidth = 2;
                ctx.setLineDash([8, 8]);
                ctx.beginPath();
                ctx.moveTo(30, 390);
                ctx.lineTo(W - 30, 390);
                ctx.stroke();
                ctx.setLineDash([]);

                // QR Box Background
                const boxSize = 320;
                const boxX = (W - boxSize) / 2;
                const boxY = 230;

                ctx.fillStyle = "#e9ebee";
                ctx.beginPath();
                ctx.roundRect(boxX, boxY, boxSize, boxSize, 20);
                ctx.fill();

                // Draw QR Code
                if (qrImg) {
                    ctx.drawImage(qrImg, boxX + 25, boxY + 25, 270, 270);
                }

                // Permit ID Number
                ctx.fillStyle = "#2c3137";
                ctx.font = "38px Arial, sans-serif";
                ctx.fillText(permitId, W / 2, 620);

                // Initial Circle
                const circleX = W / 2;
                const circleY = 720;
                ctx.fillStyle = "#e2e5e9";
                ctx.beginPath();
                ctx.arc(circleX, circleY, 45, 0, Math.PI * 2);
                ctx.fill();

                // Initial Letter
                ctx.fillStyle = "#374151";
                ctx.font = "bold 38px Arial, sans-serif";
                ctx.fillText(userInitial, circleX, circleY + 13);

                // Label ("You")
                ctx.fillStyle = "#6b7280";
                ctx.font = "22px Arial, sans-serif";
                ctx.fillText(userLabel, W / 2, 800);

                // Footer Text
                ctx.fillStyle = "#828a96";
                ctx.font = "21px Arial, sans-serif";
                ctx.fillText("Please stay close. Your visit time is", W / 2, 870);
                ctx.fillText("approaching.", W / 2, 905);

            }, 120);
        }

        function downloadCard() {
            const canvas = document.getElementById('cardCanvas');
            const permitId = document.getElementById('permit_id').value.trim();
            const fileName = permitId ? `${permitId}.jpg` : 'Permit_Card.jpg';
            
            const link = document.createElement('a');
            link.download = fileName;
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.onload = function() {
            autoFillFromNusuk();
            generateCard();
        };
    </script>

</body>
</html>
